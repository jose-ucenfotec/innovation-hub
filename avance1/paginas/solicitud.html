<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar participación · Innovation Hub</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<header id="navbar"></header>
<main class="container py-4" style="max-width: 40rem;">
  <h1 class="h4 mb-3">Solicitar participación</h1>
  <div id="bloqueo" class="alert alert-warning" role="alert" hidden></div>
  <form id="formulario-solicitud" hidden>
    <div class="mb-3">
      <label class="form-label" for="mensaje">Mensaje de presentación</label>
      <textarea id="mensaje" class="form-control" rows="3" required></textarea>
      <div class="invalid-feedback" id="error-mensaje" hidden></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="competencia">Competencia principal que aportás</label>
      <select id="competencia" class="form-select"></select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="rol">Rol deseado</label>
      <input id="rol" class="form-control" required>
      <div class="invalid-feedback" id="error-rol" hidden></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="disponibilidad">Disponibilidad</label>
      <input id="disponibilidad" class="form-control" placeholder="ej. 4 h/semana" required>
      <div class="invalid-feedback" id="error-disponibilidad" hidden></div>
    </div>
    <button type="submit" class="btn btn-primary">Enviar solicitud</button>
  </form>
  <div id="exito" class="alert alert-success mt-3" role="status" hidden></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/datos.js"></script>
<script src="../js/almacen.js"></script>
<script src="../js/reglas.js"></script>
<script src="../js/validacion.js"></script>
<script src="../js/solicitud.js"></script>
</body>
</html>
